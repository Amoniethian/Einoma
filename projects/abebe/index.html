<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abebe | Portfolio</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <!-- 水滴动画容器 -->
    <div class="ripple-container"></div>

    <!-- 顶部导航 -->
    <header class="project-header">
        <a href="../../index.html" class="back-link">
            <span>&larr;</span> Back
        </a>
        <h1 class="project-page-title">Abebe</h1>
        <div></div>
    </header>

    <!-- 主内容区 -->
    <div class="project-layout">
        <!-- 左侧固定侧边栏 -->
        <aside class="project-sidebar">
            <div class="sidebar-content">
                <h3 class="sidebar-title">About This Work</h3>
                <p class="sidebar-description">
                    一个充满赛博朋克氛围的场景设计项目。每一张图片都是一个精心构建的虚拟空间，融合了霓虹灯光、未来科技与都市生活的元素。将鼠标悬停在图片上查看更多信息。
                </p>
            </div>
            <div class="sidebar-meta">
                <div class="meta-item">
                    <span>Project</span>
                    <span>Abebe</span>
                </div>
                <div class="meta-item">
                    <span>Type</span>
                    <span>Scene Design</span>
                </div>
                <div class="meta-item">
                    <span>Images</span>
                    <span>24</span>
                </div>
            </div>
        </aside>

                    <span class="item-number">#01</span>

                    <span class="item-number">#02</span>
                </div>

                    <span class="item-number">#03</span>
                </div>
                <div class="masonry-item" data-description="霓虹招牌与城市夜景的完美结合。">
                    <img src="images/Abebe (4).png" alt="Abebe 4">

                </div>
