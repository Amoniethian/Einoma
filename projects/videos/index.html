<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos | Portfolio</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="ripple-container"></div>

    <header class="project-header">
        <a href="../../index.html" class="back-link">
            <span>&larr;</span> Back
        </a>
        <h1 class="project-page-title">Videos</h1>
        <div></div>
    </header>

    <div class="project-layout">
        <aside class="project-sidebar">
            <div class="sidebar-content">
                <h3 class="sidebar-title">About This Work</h3>
                <p class="sidebar-description">
                    视频与动画作品合集。记录动态影像的创作探索，从短片到动画，展示不同形式的视觉叙事。将鼠标悬停在视频上查看更多信息。
                </p>
            </div>
            <div class="sidebar-meta">
                <div class="meta-item">
                    <span>Project</span>
                    <span>Videos</span>
                </div>
                <div class="meta-item">
                    <span>Type</span>
                    <span>Motion</span>
                </div>
                <div class="meta-item">
                    <span>Format</span>
                    <span>MP4 / Animation</span>
                </div>
            </div>
        </aside>

        <main class="masonry-container">
            <div class="masonry-grid">
                <!-- 视频项目示例 -->
                <div class="masonry-item" data-description="动态作品展示 - 完整的视频创作。">
                    <video controls poster="assets/images/cover.png">
                        <source src="assets/video/video1.mp4" type="video/mp4">
                    </video>
                    <span class="item-number">VIDEO #01</span>
                </div>
                <!-- 根据实际视频数量添加更多... -->
            </div>
        </main>
    </div>

    <div class="scroll-progress"></div>
    <script src="../../js/main.js"></script>
</body>
</html>
