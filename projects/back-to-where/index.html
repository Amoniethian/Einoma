<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back To Where | Portfolio</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="ripple-container"></div>

    <header class="project-header">
        <a href="../../index.html" class="back-link">
            <span>&larr;</span> Back
        </a>
        <h1 class="project-page-title">Back To Where</h1>
        <div></div>
    </header>

    <div class="project-layout">
        <aside class="project-sidebar">
            <div class="sidebar-content">
                <h3 class="sidebar-title">About This Work</h3>
                <p class="sidebar-description">
                    一段关于回忆与归途的视觉叙事。这个项目探索时间与空间的交错，通过影像记录那些似曾相识却又遥不可及的瞬间。将鼠标悬停在图片上查看更多信息。
                </p>
            </div>
            <div class="sidebar-meta">
                <div class="meta-item">
                    <span>Project</span>
                    <span>Back To Where</span>
                </div>
                <div class="meta-item">
                    <span>Type</span>
                    <span>Concept Art</span>
                </div>
                <div class="meta-item">
                    <span>Theme</span>
                    <span>Memory & Journey</span>
                </div>
            </div>
        </aside>

        <main class="masonry-container">
            <div class="masonry-grid">
                <div class="masonry-item" data-description="起点 - 每一段旅程都始于一个决定。">
                    <img src="assets/images/Back_To_Where (1).png" alt="Back To Where 1">
                    <span class="item-number">#01</span>
                </div>
                <div class="masonry-item" data-description="回望 - 记忆中的风景总是带着柔光。">
                    <img src="assets/images/Back_To_Where (2).png" alt="Back To Where 2">
                    <span class="item-number">#02</span>
                </div>
                <div class="masonry-item" data-description="迷途 - 有时候迷路也是一种发现。">
                    <img src="assets/images/Back_To_Where (3).png" alt="Back To Where 3">
                    <span class="item-number">#03</span>
                </div>
                <div class="masonry-item" data-description="归途 - 回家的路总是最长也最短。">
                    <img src="assets/images/Back_To_Where (4).png" alt="Back To Where 4">
                    <span class="item-number">#04</span>
                </div>
                <div class="masonry-item" data-description="终点 - 或许终点就是新的起点。">
                    <img src="assets/images/Back_To_Where (5).png" alt="Back To Where 5">
                    <span class="item-number">#05</span>
                </div>
            </div>
        </main>
    </div>

    <div class="scroll-progress"></div>
    <script src="../../js/main.js"></script>
</body>
</html>
